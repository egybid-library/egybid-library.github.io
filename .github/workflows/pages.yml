name: Publish article library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify static library links
        run: python3 scripts/verify.py
      - name: Check application syntax
        run: |
          node --check docs/app.js
          node --check docs/article-navigation.js
          node --check docs/bookmarks.js
          node --check docs/reader.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy library
        id: deployment
        uses: actions/deploy-pages@v4
