name: Import verified article library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore the verified library source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from io import BytesIO
          import hashlib, shutil, zipfile
          parts=sorted(Path('.').glob('library-bundle.part-*'))
          assert len(parts)==6, 'Expected all six bundle parts'
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='24d024130b56aaff55564bb121368c6ab7b93bbeb9374a50d31ded6e308c2059', 'Bundle hash mismatch'
          with zipfile.ZipFile(BytesIO(data)) as bundle:
              assert bundle.testzip() is None
              for member in bundle.infolist():
                  assert member.filename.startswith('github-pages-library/')
                  relative=PurePosixPath(member.filename).relative_to('github-pages-library')
                  assert not relative.is_absolute() and '..' not in relative.parts
                  if not relative.parts or relative.parts[0]=='.github' or member.is_dir():
                      continue
                  target=Path(*relative.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with bundle.open(member) as source, target.open('wb') as out:
                      shutil.copyfileobj(source,out)
          for part in parts:
              part.unlink()
          PY
      - name: Verify article links
        run: python3 scripts/verify.py
      - name: Save the complete source in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified library with 1950 articles'
          git push origin HEAD:main
