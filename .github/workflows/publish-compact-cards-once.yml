name: Prepare reviewed compact cards once
on:
  push:
    branches: [compact-cards-20261104]
    paths: [.github/workflows/publish-compact-cards-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "809d30551a03c4d3dbf2b7f2bf858d0e53112f8a"
      - name: Load reviewed header sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Build and verify reviewed compact card sources
        run: |
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node --check docs/library-ui.js
          node scripts/test-offline.mjs
          node scripts/test-sharing.mjs
          python3 scripts/verify.py
      - name: Verify reviewed tree and update branch
        run: |
          rm .github/workflows/publish-compact-cards-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "5e72f3d91e4245089e06105b163dd1377337826f"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Unify compact article cards and smaller mobile branding'
          git push origin HEAD:compact-cards-20261104
