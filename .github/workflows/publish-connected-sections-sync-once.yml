name: Prepare reviewed sections and reading sync once
on:
  push:
    branches: [connected-sections-sync-20261104]
    paths: [.github/workflows/publish-connected-sections-sync-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "99256a2c3d12c701769bd2830ea7c8b227a5ccdc"
      - name: Load reviewed sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Install test tools
        run: npm ci
      - name: Build and verify reviewed sources
        run: |
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node --check docs/library-ui.js
          node --check docs/reading-position.js
          node --check docs/sync.js
          node scripts/test-sync.mjs
          node scripts/test-offline.mjs
          node scripts/test-sharing.mjs
          python3 scripts/verify.py
      - name: Verify reviewed tree and update branch
        run: |
          rm .github/workflows/publish-connected-sections-sync-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "c2adf0f5db61cb07bc0635222e7183601ed82e47"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Unify mobile sections and synchronize reading position'
          git push origin HEAD:connected-sections-sync-20261104
