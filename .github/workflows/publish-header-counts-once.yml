name: Prepare reviewed header counts once
on:
  push:
    branches: [header-counts-20261103]
    paths: [.github/workflows/publish-header-counts-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "854ef3cbee7f90a49671a5afb1d48af9eda70103"
      - name: Load reviewed header sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Build and verify reviewed header counts
        run: |
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node --check docs/library-ui.js
          node scripts/test-offline.mjs
          node scripts/test-sharing.mjs
          python3 scripts/verify.py
      - name: Verify reviewed tree and update branch
        run: |
          rm .github/workflows/publish-header-counts-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "290e25bb8e1aaf653a10ce820393303129483ed8"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Show live article, reading and bookmark counts in header'
          git push origin HEAD:header-counts-20261103
