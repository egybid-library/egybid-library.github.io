name: Prepare reviewed header padding once
on:
  push:
    branches: [header-padding-20261103]
    paths: [.github/workflows/publish-header-padding-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "70c6950f385e162a2dc80b356d44c46f608d076f"
      - name: Load reviewed header sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Build and verify reviewed header padding
        run: |
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node --check docs/library-ui.js
          node scripts/test-offline.mjs
          node scripts/test-sharing.mjs
          python3 scripts/verify.py
      - name: Verify reviewed tree and update branch
        run: |
          rm .github/workflows/publish-header-padding-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "563ccc793922871aafd59263b38f5f5eb6150bee"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve padding around header article count'
          git push origin HEAD:header-padding-20261103
