name: Publish reviewed library changes once
on:
  push:
    branches: [library-navigation-preview-20261103]
    paths: [.github/workflows/publish-library-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "28b7034e7a34a08d02758b87938d97a6adc8afe8"
      - name: Reproduce the reviewed local version
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,io,tarfile,subprocess
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          manifest=Path('docs/offline-manifest.json').read_bytes()
          subprocess.run(['node','scripts/build-offline.mjs'],check=True)
          # Transfer estimates come from the reviewed local build; content checksums are exact.
          Path('docs/offline-manifest.json').write_bytes(manifest)
          PYCODE
      - name: Verify article library and link previews
        run: |
          python3 scripts/verify.py
          node scripts/test-search.mjs
          node scripts/test-sharing.mjs
          node scripts/test-offline.mjs
          node --check docs/library-ui.js
          node --check docs/article-search.js
          node --check docs/article-navigation.js
      - name: Verify exact tree and update review branch
        run: |
          rm .github/workflows/publish-library-once.yml
          git add -A
          test "$(git write-tree)" = "377fd8b704203206f92dc3095fb8c84222d7aa56"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Improve library navigation, mobile menus and link previews'
          git push origin HEAD:library-navigation-preview-20261103
