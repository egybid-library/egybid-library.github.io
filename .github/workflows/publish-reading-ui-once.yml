name: Prepare reviewed library interface once
on:
  push:
    branches: [library-unified-navigation-20261103]
    paths: [.github/workflows/publish-reading-ui-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "731c0faaedb0c3b114313dae5c67a66b809ac21b"
      - name: Reproduce reviewed local library
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile,subprocess
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          manifest=Path('docs/offline-manifest.json').read_bytes()
          subprocess.run(['node','scripts/build-offline.mjs'],check=True)
          Path('docs/offline-manifest.json').write_bytes(manifest)
          PYCODE
      - name: Verify library, previews and offline data
        run: |
          python3 scripts/verify.py
          node scripts/test-search.mjs
          node scripts/test-sharing.mjs
          node scripts/test-offline.mjs
          node --check docs/app.js
          node --check docs/article-navigation.js
          node --check docs/article-search.js
          node --check docs/library-ui.js
          node --check docs/theme.js
      - name: Verify exact reviewed tree and update branch
        run: |
          rm .github/workflows/publish-reading-ui-once.yml
          git add -A
          test "$(git write-tree)" = "2c96fa2f4a6c29151af96bb7474ef801868e810b"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Unify library browsing and simplify reading controls'
          git push origin HEAD:library-unified-navigation-20261103
