name: Prepare reviewed resume reading once
on:
  push:
    branches: [resume-reading-20261104]
    paths: [.github/workflows/publish-resume-reading-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "b3cf5d8cdebf8f2a9a0dc35739ed463c16744c61"
      - name: Load reviewed header sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Build and verify reviewed resume reading sources
        run: |
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node --check docs/library-ui.js
          node scripts/test-offline.mjs
          node scripts/test-sharing.mjs
          python3 scripts/verify.py
      - name: Verify reviewed tree and update branch
        run: |
          rm .github/workflows/publish-resume-reading-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "ee9702324856c7bfd2eac7e7a0e5716914db1585"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add local resume reading with original text read controls'
          git push origin HEAD:resume-reading-20261104
