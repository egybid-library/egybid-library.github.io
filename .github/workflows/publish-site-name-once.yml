name: Apply reviewed site name once
on:
  push:
    branches: [site-name-20261101]
    paths: [.github/workflows/publish-site-name-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "8a18aa04d565a4f8b28d23ee76c2dc7c6660e987"
      - name: Apply exact locally reviewed metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          root=Path('docs')
          name='مكتبة المكتب المصري للتطوير الصناعي'
          pages=[root/'index.html',root/'reading.html',root/'bookmarks.html',root/'profile.html',*sorted((root/'articles').glob('*.html'))]
          assert len(pages)==1954
          for path in pages:
              before=path.read_text()
              prefix,sep,content=before.partition('<section id="organized"')
              prefix=re.sub(r'<title>.*?</title>','<title>'+name+'</title>',prefix,count=1)
              description='<meta name="description" content="'+name+'">'
              if re.search(r'<meta name="description" content="[^\"]*">',prefix):
                  prefix=re.sub(r'<meta name="description" content="[^\"]*">',lambda m:description,prefix)
              else:prefix=prefix.replace('<title>',description+'<title>',1)
              tags={key:'<meta property="'+key+'" content="'+name+'">' for key in ['og:site_name','og:title','og:description']}
              order=['og:description','og:site_name','og:title'] if sep else ['og:site_name','og:title','og:description']
              prefix=prefix.replace('</title>','</title>'+''.join(tags[key] for key in order),1)
              path.write_text(prefix+sep+content)
          (root/'offline-manifest.json').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
      - name: Check library and offline assets
        run: |
          python3 scripts/verify.py
          node scripts/test-offline.mjs
      - name: Verify exact tree and publish review branch
        run: |
          rm .github/workflows/publish-site-name-once.yml
          git add docs .github/workflows/publish-site-name-once.yml
          test "$(git write-tree)" = "425805460ca12159cc2dbbd54de33a939201bbaf"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Unify site name, page titles and sharing descriptions'
          git push origin HEAD:site-name-20261101
