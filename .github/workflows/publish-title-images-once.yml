name: Prepare reviewed article title images once
on:
  push:
    branches: [article-title-images-20261103]
    paths: [.github/workflows/publish-title-images-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify reviewed publication base
        run: test "$(git rev-parse HEAD^)" = "2fa95ef04879b416f647e76cfff0a5c16f208f6a"
      - name: Load reviewed build sources
        run: |
          python3 - <<'PYCODE'
          import base64,lzma,io,tarfile
          from pathlib import Path
          payload=''
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(payload)))) as bundle:
              for item in bundle.getmembers():
                  assert item.isfile() and not item.name.startswith('/') and '..' not in Path(item.name).parts
              bundle.extractall('.')
          Path('/tmp/reviewed-offline-manifest.json').write_bytes(Path('docs/offline-manifest.json').read_bytes())
          PYCODE
      - name: Install pinned image tools
        run: npm ci
      - name: Generate and verify title images
        run: |
          node scripts/build-share-images.mjs
          node scripts/test-share-images.mjs
          node scripts/build-offline.mjs
          cp /tmp/reviewed-offline-manifest.json docs/offline-manifest.json
          node scripts/test-sharing.mjs
          node scripts/test-search.mjs
          node scripts/test-offline.mjs
          python3 scripts/verify.py
      - name: Verify exact reviewed tree and update branch
        run: |
          rm .github/workflows/publish-title-images-once.yml
          git add -A
          actual=$(git write-tree)
          echo "Generated tree: $actual"
          test "$actual" = "ef8fb3bb5aad0b2e4329ba9989a24328678dc228"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate article title sharing images with incremental updates'
          git push origin HEAD:article-title-images-20261103
